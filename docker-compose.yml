version: '3.9'

services:
  app:
    image: php:8.2-apache
    container_name: bogoehallen-app
    working_dir: /var/www/html
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_USER: bogoehallen
      DB_PASSWORD: bogoehallen
      DB_NAME: bogoehallen
      SITE_URL: http://localhost:8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bogoehallen-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bogoehallen
      MYSQL_USER: bogoehallen
      MYSQL_PASSWORD: bogoehallen
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
